[project]
name = "shop-broken-tdd"
version = "0.1.0"
description = "Educational repository for TDD and CI workshops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.6",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "RET", "SIM"]
ignore = ["C901", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--tb=short"
pythonpath = ["src"]
